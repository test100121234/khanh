name: Build Standalone QA Remote Agent & Fake WDA

on:
  push:
    branches: [ main, master ]
    tags:
      - "*.*.*"
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-agent-ipa:
    name: Build Standalone iOS Agent & IPAs
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Select Latest Xcode 15.4 / 16.0
        run: |
          echo "[*] Available Xcode versions on Runner:"
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install zsign for Enterprise Signing
        run: |
          echo "[*] Installing zsign via Homebrew..."
          brew install zsign || true
          zsign --version || true

      - name: Validate Project Integrity
        run: |
          echo "[*] Verifying project structure..."
          test -f devicekit-ios.xcodeproj/project.pbxproj
          test -f DeviceKit/Info.plist
          test -f DeviceKit/RemoteAgent/ApplePrivateHeaders.h
          test -f DeviceKit/RemoteAgent/AgentWebSocketServer.m
          test -f DeviceKit/RemoteAgent/SilentAudioQueue.m
          test -f DeviceKit/RemoteAgent/ScreenTelemetryCapturer.m
          test -f DeviceKit/RemoteAgent/HIDEventSynthesizer.m
          test -f DeviceKit/RemoteAgent/SystemController.m
          echo "[✓] Core files verified."

      - name: Build Standalone App (ARM64 iOS)
        run: |
          echo "[*] Compiling Standalone iOS Agent with Xcode..."
          make build CONFIGURATION=Release

      - name: Package Unsigned IPA (For Custom Signing)
        run: |
          echo "[*] Packaging clean unsigned IPA..."
          make ipa CONFIGURATION=Release
          cp build/export/devicekit-ios.ipa build/export/devicekit-ios-unsigned.ipa
          ls -lh build/export/

      - name: Package & Sign Enterprise IPA (HSBC InHouse)
        run: |
          echo "[*] Packaging and signing with HSBC InHouse certificate..."
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh -p cert/HSBC.mobileprovision -c cert/HSBC.p12 -k yay
          ls -lh build/export/

      - name: Build & Package WebDriverAgentRunner (XCUITest Touch Engine)
        run: |
          echo "[*] Cloning official WebDriverAgent engine..."
          git clone --depth 1 https://github.com/appium/WebDriverAgent.git wda_src
          cd wda_src
          echo "[*] Compiling WebDriverAgentRunner for iOS Device..."
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || true
          
          cd ..
          mkdir -p wda_export/Payload
          if [ -d "wda_src/build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app" ]; then
            cp -r wda_src/build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app wda_export/Payload/
            cd wda_export && zip -r -y ../build/export/WebDriverAgentRunner-unsigned.ipa Payload
            cd ..
            echo "[✓] Successfully packaged WebDriverAgentRunner-unsigned.ipa"
          else
            echo "[!] WebDriverAgentRunner build path not found, searching..."
            find wda_src/build -name "*.app" -type d
          fi

      - name: Upload Unsigned IPA Artifact (Ready for Custom Cert Signing)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: devicekit-ios-unsigned-ipa
          path: build/export/devicekit-ios-unsigned.ipa
          retention-days: 14

      - name: Upload WebDriverAgentRunner IPA Artifact (Ready for Custom Cert Signing)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: webdriveragent-runner-unsigned-ipa
          path: build/export/WebDriverAgentRunner-unsigned.ipa
          retention-days: 14

      - name: Upload Signed Enterprise IPA Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: devicekit-ios-enterprise-signed-ipa
          path: build/export/devicekit-ios-enterprise-signed.ipa
          retention-days: 14

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: devicekit-ios-app-bundle
          path: build/Build/Products/Release-iphoneos/devicekit-ios.app
          retention-days: 14

  test-python-coordinator:
    name: Verify Multi-Core Coordinator Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets numpy opencv-python-headless

      - name: Syntax & Import Check Coordinator Server
        run: |
          python -m py_compile server/coordinator_server.py
          python -c "import server.coordinator_server; print('[✓] Coordinator server imported successfully')"

  publish-github-release:
    name: Publish Release with IPAs
    needs: [build-agent-ipa, test-python-coordinator]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Unsigned IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: devicekit-ios-unsigned-ipa

      - name: Download Signed IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: devicekit-ios-enterprise-signed-ipa

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }}
          files: |
            *.ipa
          generate_release_notes: true
