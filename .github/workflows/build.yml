name: Build & Sign Standalone QA Remote Agent (HSBC Enterprise)

on:
  push:
    branches: [ main, master ]
    tags:
      - "*.*.*"
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-sign-ipa:
    name: Build & Sign Standalone iOS Agent
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Select Latest Xcode 15.4 / 16.0
        run: |
          echo "[*] Available Xcode versions on Runner:"
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install zsign for Enterprise Re-signing
        run: |
          echo "[*] Installing zsign via Homebrew..."
          brew install zsign || {
            echo "[*] Fallback: Building zsign from source..."
            git clone --depth 1 https://github.com/zhlynn/zsign.git /tmp/zsign
            cd /tmp/zsign
            g++ *.cpp -lcrypto -I/opt/homebrew/opt/openssl/include -L/opt/homebrew/opt/openssl/lib -O3 -o /usr/local/bin/zsign || brew install openssl && g++ *.cpp -lcrypto -I$(brew --prefix openssl)/include -L$(brew --prefix openssl)/lib -O3 -o /usr/local/bin/zsign
          }
          zsign --version || true

      - name: Validate Certificate & Project Integrity
        run: |
          echo "[*] Verifying HSBC Certificate and Core Files..."
          test -f cert/HSBC.mobileprovision
          test -f cert/HSBC.p12
          test -f devicekit-ios.xcodeproj/project.pbxproj
          test -f DeviceKit/Info.plist
          test -f DeviceKit/RemoteAgent/ApplePrivateHeaders.h
          test -f DeviceKit/RemoteAgent/AgentWebSocketServer.m
          test -f DeviceKit/RemoteAgent/SilentAudioQueue.m
          test -f DeviceKit/RemoteAgent/ScreenTelemetryCapturer.m
          test -f DeviceKit/RemoteAgent/HIDEventSynthesizer.m
          test -f DeviceKit/RemoteAgent/SystemController.m
          echo "[✓] All files and certificates verified."

      - name: Build Standalone App (ARM64 iOS)
        run: |
          echo "[*] Compiling Standalone iOS Agent with Xcode..."
          make build CONFIGURATION=Release

      - name: Package & Sign Enterprise IPA (HSBC InHouse)
        run: |
          echo "[*] Packaging and signing with HSBC InHouse certificate..."
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh -p cert/HSBC.mobileprovision -c cert/HSBC.p12 -k yay
          ls -lh build/export/

      - name: Upload Signed Enterprise IPA Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: devicekit-ios-enterprise-signed-ipa
          path: build/export/*.ipa
          retention-days: 14

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: devicekit-ios-app-bundle
          path: build/Build/Products/Release-iphoneos/devicekit-ios.app
          retention-days: 14

  test-python-coordinator:
    name: Verify Multi-Core Coordinator Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets numpy opencv-python-headless

      - name: Syntax & Import Check Coordinator Server
        run: |
          python -m py_compile server/coordinator_server.py
          python -c "import server.coordinator_server; print('[✓] Coordinator server imported successfully')"

  publish-github-release:
    name: Publish Release with Signed IPA
    needs: [build-and-sign-ipa, test-python-coordinator]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Signed IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: devicekit-ios-enterprise-signed-ipa

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }} (HSBC Signed)
          files: |
            *.ipa
          generate_release_notes: true
